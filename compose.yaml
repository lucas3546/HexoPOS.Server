services:
  hexapos.web:
    image: hexapos.web
    build:
      context: .
      dockerfile: src/HexaPOS.Web/Dockerfile
    ports:
      - "8080:8080"
      - "8081:8081"
  
  postgres:
    image: postgres
    restart: always
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-db-volume:/var/lib/postgresql/MAJOR/docker
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}

volumes:
  postgres-db-volume:
    driver: local